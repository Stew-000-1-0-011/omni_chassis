# chassis_node のパラメータ。
# 「起動時のみ」以外は ros2 param set で実行中に変えられる。
chassis_node:
  ros__parameters:
    # --- 起動時のみ ---
    cmd_vel_topic: cmd_vel
    cmd_vel_stamped: false      # true なら TwistStamped で受ける
    control_rate: 50.0          # [Hz] robomas_target を出す周期
    robomas_frame_topic: robomas_frame
    robomas_target_prefix: robomas_target   # 出力は <prefix><モータ番号>
    enable_on_start: true       # false なら ~/enable で有効にするまで脱力

    # --- 車輪 (機体座標系: x 前、y 左。原点は回転中心にしたい点) ---
    # 要素の並びは全項目で揃える。ここの値は 4輪オムニ X 配置の例なので、実機に合わせること。
    # angle_deg: 車輪が正転したときに接地点が機体を押す向き [deg]
    wheels:
      x: [0.2, -0.2, -0.2, 0.2]          # [m]
      y: [0.2, 0.2, -0.2, -0.2]          # [m]
      angle_deg: [135.0, 225.0, 315.0, 45.0]
      radius: [0.05, 0.05, 0.05, 0.05]   # [m]
      motor: [1, 2, 3, 4]                # robomas のモータ番号 (1..8)
      gear_ratio: [19.2, 19.2, 19.2, 19.2]  # モータ回転 / 車輪回転。負で回転方向を反転
      c620: [true, true, true, true]     # C620 (M3508) なら true、C610 (M2006) なら false

    # モータ軸の角速度 [rad/s] -> robomas_target の値。ファームの速度の単位に合わせる
    target_per_motor_rad_s: 1.0

    # 速度制御モードに入れるときに送るゲインと温度上限 (robomas_plugins の get_vel_frame と同じ既定値)
    motor:
      velkp: 0.15
      velki: 9.0
      temp_limit: 50

    # --- 実行中に変えられる ---
    cmd_timeout: 0.2            # [s] cmd_vel がこれより来なければ目標をゼロにする
    # 車輪の制限 (<= 0 で無効)。全車輪に同じ倍率をかけるので、進む向きは変わらない
    limits:
      max_wheel_speed: 0.0      # [rad/s] 車輪軸
      max_wheel_accel: 0.0      # [rad/s^2] 車輪軸
