# chassis_node のパラメータ。
# 「起動時のみ」以外は ros2 param set で実行中に変えられる。
chassis_node:
  ros__parameters:
    # --- 起動時のみ ---
    cmd_vel_topic: cmd_vel
    cmd_vel_stamped: false      # true なら TwistStamped で受ける
    control_rate: 50.0          # [Hz] 目標を出す周期

    # --- 車輪 (機体座標系: x 前、y 左。原点は回転中心にしたい点) ---
    # 要素の並びは全項目で揃える。ここの値は 4輪オムニ X 配置の例なので、実機に合わせること。
    # angle_deg: 車輪が正転したときに接地点が機体を押す向き [deg]
    wheels:
      x: [0.2, -0.2, -0.2, 0.2]          # [m]
      y: [0.2, 0.2, -0.2, -0.2]          # [m]
      angle_deg: [135.0, 225.0, 315.0, 45.0]
      radius: [0.05, 0.05, 0.05, 0.05]   # [m]
      # 目標角速度 [rad/s] (std_msgs/Float64) を出すトピック
      topic: [wheel0/target_velocity, wheel1/target_velocity, wheel2/target_velocity, wheel3/target_velocity]
      # 出力軸の回転 / 車輪の回転。負で回転方向を反転。ドライバが車輪軸基準なら ±1
      gear_ratio: [1.0, 1.0, 1.0, 1.0]
      # 車輪ごとの実測 (sensor_msgs/JointState、velocity[0] が出力軸の角速度 [rad/s])。任意。
      # あれば ~/body_velocity に機体速度の推定値 (車輪オドメトリ) を出す
      feedback_topic: []

    # --- 実行中に変えられる ---
    base_frame: base_link       # ~/body_velocity の frame_id

    cmd_timeout: 0.2
    feedback_timeout: 0.1       # [s] 実測がこれより古い車輪があれば ~/body_velocity を出さない            # [s] cmd_vel がこれより来なければ目標をゼロにする
    # 車輪の制限 (<= 0 で無効)。全車輪に同じ倍率をかけるので、進む向きは変わらない
    limits:
      max_wheel_speed: 0.0      # [rad/s] 車輪軸
      max_wheel_accel: 0.0      # [rad/s^2] 車輪軸
